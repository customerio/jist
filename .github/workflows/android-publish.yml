name: Publish Android (manual)

# Manual / dry-run only for now — no automated release trigger yet (tracked as a follow-up).
# Publishes io.customer.android:jist to the Sonatype Central Portal staging repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0-alpha01)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android
        uses: customerio/mobile-ci-tools/github-actions/android/setup-android/v1@main

      - name: Publish to Sonatype (staging)
        env:
          MODULE_VERSION: ${{ inputs.version }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :jist:publishReleasePublicationToSonatypeRepository
          --max-workers 1
          closeAndReleaseSonatypeStagingRepository
