name: Publish Android

# Triggered only by an android-vX.Y.Z tag (created by "Release Android"). Publishes
# io.customer.android:jist to Maven Central and releases the staging repository. This never
# runs on a push/merge to main — only on a release tag — so merging a PR publishes nothing.
on:
  push:
    tags:
      - 'android-v*'

concurrency:
  group: publish-android
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'customerio'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the tag's commit can be checked for main ancestry below

      - name: Verify the tagged commit is on main
        # A matching android-vX.Y.Z tag pushed from any branch would otherwise pass the version check
        # and publish that branch's code. Only publish tags whose commit is actually on main.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag $GITHUB_REF_NAME is not android-vX.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the committed version
        run: |
          committed=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$committed" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.version.outputs.version }} != committed VERSION_NAME $committed"
            exit 1
          fi

      - name: Setup Android
        uses: customerio/mobile-ci-tools/github-actions/android/setup-android/v1@main

      - name: Publish and release to Maven Central
        # The shared io.customer.android.publish-module plugin reads MODULE_VERSION and the
        # signing/credentials env below. closeAndRelease promotes the staging repo to Maven Central.
        env:
          MODULE_VERSION: ${{ steps.version.outputs.version }}
          OSSRH_USERNAME: ${{ secrets.GRADLE_PUBLISH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.GRADLE_PUBLISH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.GRADLE_SIGNING_KEYID }}
          SIGNING_PASSWORD: ${{ secrets.GRADLE_SIGNING_PASSPHRASE }}
          SIGNING_KEY: ${{ secrets.GRADLE_SIGNING_PRIVATE_KEY }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
        run: >-
          ./gradlew :jist:publishReleasePublicationToSonatypeRepository
          --max-workers 1
          closeAndReleaseSonatypeStagingRepository

      - name: Summary
        run: echo "Published io.customer.android:jist:${{ steps.version.outputs.version }} to Maven Central." >> "$GITHUB_STEP_SUMMARY"
