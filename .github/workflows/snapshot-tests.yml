name: Snapshot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Pin runner and tool versions ─────────────────────────────────
# Snapshot tests are pixel-sensitive. Changing any of these versions
# will likely require re-recording baselines:
#   Web:     npx playwright test --update-snapshots
#   iOS:     uncomment isRecording in setUp(), run swift test, re-commit
#   Android: ./gradlew :jist:recordPaparazziDebug
env:
  MACOS_RUNNER: macos-26
  UBUNTU_RUNNER: ubuntu-24.04
  XCODE_VERSION: "16.4"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  web:
    name: Web (Playwright)
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium

      - name: Run snapshot tests
        run: npx playwright test

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-snapshot-diffs
          path: web/test-results/

  ios:
    name: iOS (swift-snapshot-testing)
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Run snapshot tests
        run: swift test

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshot-diffs
          path: ios/Tests/JistTests/__Snapshots__/

  android:
    name: Android (Paparazzi)
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run snapshot tests
        run: ./gradlew :jist:verifyPaparazziDebug

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-snapshot-diffs
          path: android/jist/build/reports/paparazzi/
