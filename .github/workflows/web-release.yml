name: Release Web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version component to bump'
        type: choice
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SRE_GHACTIONS_TOKEN }}

      - name: Verify all checks passed on main
        run: |
          COMMIT=$(git rev-parse HEAD)
          FAILED=$(gh api "repos/${{ github.repository }}/commits/$COMMIT/check-runs" \
            --paginate --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          TOTAL=$(gh api "repos/${{ github.repository }}/commits/$COMMIT/check-runs" \
            --paginate --jq '.total_count')
          if [ "$TOTAL" -eq 0 ]; then
            echo "No check runs found for $COMMIT. Aborting release."
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "Some checks did not pass on $COMMIT. Aborting release."
            gh api "repos/${{ github.repository }}/commits/$COMMIT/check-runs" \
              --paginate --jq '.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.conclusion) \(.name)"'
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Bump version
        working-directory: web
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        working-directory: web
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "ami-ci"
          git config user.email "<>"
          git add web/package.json web/package-lock.json
          git commit -m "web: bump version to ${{ steps.version.outputs.version }}"
          git tag "web-v${{ steps.version.outputs.version }}"
          git push origin main "web-v${{ steps.version.outputs.version }}"
