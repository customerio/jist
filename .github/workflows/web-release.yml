name: Release Web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version component to bump'
        type: choice
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SRE_GHACTIONS_TOKEN }}

      - name: Verify all checks passed on main
        run: |
          COMMIT=$(git rev-parse HEAD)
          STATUS=$(gh api "repos/${{ github.repository }}/commits/$COMMIT/status" --jq '.state')
          if [ "$STATUS" != "success" ]; then
            echo "Commit $COMMIT has combined status: $STATUS. Aborting release."
            gh api "repos/${{ github.repository }}/commits/$COMMIT/status" --jq '.statuses[] | select(.state != "success") | "\(.state) \(.context)"'
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        working-directory: web
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        working-directory: web
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "ami-ci"
          git config user.email "<>"
          git add web/package.json web/package-lock.json
          git commit -m "web: bump version to ${{ steps.version.outputs.version }}"
          git tag "web-v${{ steps.version.outputs.version }}"
          git push origin main "web-v${{ steps.version.outputs.version }}"
