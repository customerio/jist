name: JistExample
options:
  bundleIdPrefix: com.customerio.jist
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  JistExample:
    type: application
    platform: iOS
    sources:
      - path: JistExample
    dependencies:
      - package: Jist
packages:
  Jist:
    path: ../
