<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jist — Template Renderer Example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/jist.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark {
      background: #121218;
      color: #e8e8f0;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #d0d0d8;
      border-radius: 8px;
      background: #fff;
      color: #1a1a2e;
      cursor: pointer;
      transition: all 0.15s;
    }

    body.dark .controls button {
      background: #1e1e2a;
      border-color: #3a3a4c;
      color: #e8e8f0;
    }

    .controls button:hover {
      background: #f0f0f4;
    }

    body.dark .controls button:hover {
      background: #2a2a3c;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e2e8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    body.dark .card {
      background: #1e1e2a;
      border-color: #2a2a3c;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8ea0;
      margin-bottom: 12px;
    }

    .log {
      margin-top: 32px;
      padding: 16px;
      background: #1a1a2e;
      border-radius: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: #a5b4fc;
      max-height: 200px;
      overflow-y: auto;
    }

    .log:empty::before {
      content: "Action events will appear here...";
      color: #4a4a68;
    }

    .log div {
      padding: 4px 0;
      border-bottom: 1px solid #2a2a3c;
    }

    .log div:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Jist</h1>
      <div class="controls">
        <button id="toggle-mode">Dark Mode</button>
      </div>
    </header>

    <!-- Basic template -->
    <div class="card">
      <div class="card-label">Basic</div>
      <jist-template id="t-basic"></jist-template>
    </div>

    <!-- Image template -->
    <div class="card">
      <div class="card-label">Image</div>
      <jist-template id="t-image"></jist-template>
    </div>

    <!-- CTA template -->
    <div class="card">
      <div class="card-label">Call to Action</div>
      <jist-template id="t-cta"></jist-template>
    </div>

    <!-- Action wrapper template -->
    <div class="card">
      <div class="card-label">Clickable Card (Action Wrapper)</div>
      <jist-template id="t-action"></jist-template>
    </div>

    <!-- Hero template -->
    <div class="card">
      <div class="card-label">Hero</div>
      <jist-template id="t-hero"></jist-template>
    </div>

    <!-- Inbox template -->
    <div class="card">
      <div class="card-label">Inbox</div>
      <jist-template id="t-inbox"></jist-template>
    </div>

    <!-- Profile template -->
    <div class="card">
      <div class="card-label">Profile</div>
      <jist-template id="t-profile"></jist-template>
    </div>

    <!-- Stats template -->
    <div class="card">
      <div class="card-label">Stats</div>
      <jist-template id="t-stats"></jist-template>
    </div>

    <!-- Announcement template -->
    <div class="card">
      <div class="card-label">Announcement</div>
      <jist-template id="t-announcement"></jist-template>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
